name: Build and Push Packages to Cachix

on:
  push:
    branches: [master]
    paths: &paths
      - 'pkgs/**'
      - 'overlays/**'
      - 'modules/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'build-and-cache.sh'
      - '.github/workflows/**'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: moskas
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Only nix-fast-build pushes, otherwise every fetched source gets uploaded too
          skipPush: true
      - name: Evaluate all packages and modules
        run: nix flake check --no-build
      - name: Build packages
        if: github.event_name == 'pull_request'
        run: ./build-and-cache.sh --no-push
      - name: Build and push packages
        if: github.event_name != 'pull_request'
        run: ./build-and-cache.sh
